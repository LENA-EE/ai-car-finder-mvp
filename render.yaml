services:
  # Backend API
  - type: web
    name: ai-car-finder-backend
    runtime: node
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false  # Set manually in dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false  # Set manually in dashboard (also used for embeddings)
      - key: LLM_TEMPERATURE
        value: "0.1"
      - key: LLM_MAX_TOKENS
        value: "200"
      - key: RATE_LIMIT_USER
        value: "100"
      - key: RATE_LIMIT_ADMIN
        value: "50"
    healthCheckPath: /health

  # Frontend Static Site
  - type: web
    name: ai-car-finder-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://ai-car-finder-backend.onrender.com
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=31536000
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
