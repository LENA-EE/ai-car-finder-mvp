# AI Car Finder MVP - Docker Compose
# Согласно architecture.txt section 11

services:
  # ===========================================
  # Backend API (Node.js + Express)
  # ===========================================
  backend:
    build: ./backend
    ports:
      - "3002:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/ai_car_finder
      - JWT_SECRET=dev-jwt-secret-32-characters-long
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - LLM_TEMPERATURE=0.1
      - LLM_MAX_TOKENS=200
      - CORS_ORIGIN=http://localhost:3003
      - RATE_LIMIT_USER=100
      - RATE_LIMIT_ADMIN=50
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ===========================================
  # Frontend (React + Vite)
  # ===========================================
  frontend:
    build: ./frontend
    ports:
      - "3003:3001"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:3002

  # ===========================================
  # Database (PostgreSQL 16)
  # ===========================================
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ai_car_finder
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
